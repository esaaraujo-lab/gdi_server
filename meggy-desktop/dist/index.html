<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meggy — Plataforma de Estudos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(circle at 30% 20%, #1a1d2e 0%, #0D0E12 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: #E6E6E6;
        }
        .loader {
            text-align: center;
            width: 320px;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 139, 159, 0.15);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                        0 0 60px rgba(255, 139, 159, 0.08);
            backdrop-filter: blur(6px);
        }
        .logo {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 12px rgba(255, 139, 159, 0.35));
            animation: bob 2.4s ease-in-out infinite;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #FF8B9F 0%, #FFB37F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.02em;
        }
        .tagline {
            font-size: 13px;
            color: #8B949E;
            margin-bottom: 22px;
            letter-spacing: 0.04em;
        }
        .version-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #FF8B9F;
            background: rgba(255, 139, 159, 0.10);
            border: 1px solid rgba(255, 139, 159, 0.25);
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 22px;
            letter-spacing: 0.06em;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: #232634;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF8B9F 0%, #FFB37F 100%);
            border-radius: 2px;
            animation: load 0.95s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .status {
            font-size: 12px;
            color: #6E7681;
            letter-spacing: 0.02em;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        @keyframes load {
            0%   { width: 0%; }
            40%  { width: 45%; }
            70%  { width: 75%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo">🐩</div>
        <h1>Meggy</h1>
        <div class="tagline">PLATAFORMA DE ESTUDOS</div>
        <div class="version-badge">v1.3.0</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="status">Conectando ao educa.eu.org…</div>
    </div>
    <script>
        // ============================================================
        // Meggy Desktop v1.3.0 — Loader + JS bridge documentation
        // ============================================================
        //
        // This loader page runs inside the native Tauri webview. After
        // a brief loading screen it redirects to https://educa.eu.org.
        //
        // Because `withGlobalTauri` is enabled in tauri.conf.json, the
        // web app at educa.eu.org can detect that it is running inside
        // Meggy Desktop via:
        //
        //     const isDesktop = typeof window.__TAURI__ !== 'undefined'
        //                       && typeof window.__TAURI__.core !== 'undefined';
        //
        // v1.3.0 ALSO injects a `window.meggyDesktop.*` bridge via the
        // Rust `on_page_load` callback (src-tauri/src/lib.rs). The bridge
        // is re-injected on every navigation, so it's available on the
        // local loader AND on educa.eu.org. Available methods:
        //
        //     await window.meggyDesktop.downloadVideo(url, filename, course);
        //     await window.meggyDesktop.checkUpdates();
        //     await window.meggyDesktop.openUpdateUrl();
        //     await window.meggyDesktop.showAbout();
        //     await window.meggyDesktop.openDownloads();
        //     await window.meggyDesktop.openNewWindow();
        //     await window.meggyDesktop.toggleWindow();
        //
        // Custom Tauri commands (src-tauri/src/lib.rs) — also callable
        // directly via `window.__TAURI__.core.invoke('cmd', args)`:
        //
        //     open_downloads_folder() → string
        //     open_new_window() → void
        //     toggle_main_window() → void
        //     check_for_updates() → { current_version, latest_version,
        //                              has_update, download_url }
        //     open_update_url() → void
        //     show_about_dialog() → void
        //     download_video(url, filename, course) → string (filepath)
        //
        // Global keyboard shortcuts (work even when the app is not
        // focused) — registered in Rust:
        //
        //     Ctrl+Shift+M — toggle main window visibility
        //     Ctrl+Shift+N — open a new window
        //     Ctrl+Shift+D — open the downloads folder
        //
        // In-player keyboard shortcuts (work when a video player has
        // focus) — injected via on_page_load on every navigation:
        //
        //     Space         — play / pause
        //     ← / →         — seek -10s / +10s
        //     ↑ / ↓         — volume up / down
        //     F             — toggle fullscreen
        //     M             — toggle mute
        //     0-9           — seek to 0%-90%
        //
        // The system tray menu exposes the same actions plus
        // "Mostrar / Ocultar / Sair".
        // ============================================================

        // Redirect to the web app after the loading screen.
        // Using replace() so the back button doesn't return to this loader.
        setTimeout(function() {
            window.location.replace("https://educa.eu.org");
        }, 1000);
    </script>
</body>
</html>
