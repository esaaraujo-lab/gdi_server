<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meggy — Plataforma de Estudos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D0E12;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .loader {
            text-align: center;
        }
        .loader h1 {
            font-size: 64px;
            margin-bottom: 12px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .loader h2 {
            font-size: 28px;
            color: #FF8B9F;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .loader p {
            color: #8B949E;
            font-size: 14px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #232634;
            border-top-color: #FF8B9F;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 24px auto 0;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <h1>🐩</h1>
        <h2>Meggy</h2>
        <p>Carregando plataforma de estudos...</p>
        <div class="spinner"></div>
    </div>
    <script>
        // ============================================================
        // Meggy Desktop v1.1.0 — JS bridge
        // ============================================================
        //
        // This loader page runs inside the native Tauri webview. After
        // a brief loading screen it redirects to https://educa.eu.org.
        //
        // Because `withGlobalTauri` is enabled in tauri.conf.json, the
        // web app at educa.eu.org can detect that it is running inside
        // Meggy Desktop via:
        //
        //     const isDesktop = typeof window.__TAURI__ !== 'undefined'
        //                       && typeof window.__TAURI__.core !== 'undefined';
        //
        // And then call the custom Tauri commands registered in
        // src-tauri/src/lib.rs:
        //
        //     // Open a second Meggy window (e.g. for notes / forum).
        //     await window.__TAURI__.core.invoke('open_new_window');
        //
        //     // Toggle the main window visibility (show/hide).
        //     await window.__TAURI__.core.invoke('toggle_main_window');
        //
        //     // Open the Meggy downloads folder in the file manager.
        //     // The folder is created at ~/Meggy/Downloads/ on first call.
        //     await window.__TAURI__.core.invoke('open_downloads_folder');
        //
        // Global keyboard shortcuts (work even when the app is not
        // focused) are also available:
        //
        //     Ctrl+Shift+M — toggle main window visibility
        //     Ctrl+Shift+N — open a new window
        //     Ctrl+Shift+D — open the downloads folder
        //
        // The system tray menu exposes the same actions plus
        // "Mostrar / Ocultar / Sair".
        // ============================================================

        // Redirect to the web app after the loading screen.
        // Using replace() so the back button doesn't return to this loader.
        setTimeout(function() {
            window.location.replace("https://educa.eu.org");
        }, 800);
    </script>
</body>
</html>
