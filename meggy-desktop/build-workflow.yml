# Meggy Desktop — Build & Release workflow
name: Build Meggy Desktop (Win + Mac + Linux)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmpv-dev

      - name: Install frontend deps
        working-directory: meggy-desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: meggy-desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Meggy Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## 🐩 Meggy Desktop ${{ github.ref_name }}

            ### 📥 Downloads

            **Windows:**
            - [Instalador .exe (NSIS)](https://github.com/esaaraujo-lab/gdi_server/releases/download/${{ github.ref_name }}/Meggy_${{ github.ref_name | replace:'desktop-v','' }}_x64-setup.exe)
            - [Instalador .msi](https://github.com/esaaraujo-lab/gdi_server/releases/download/${{ github.ref_name }}/Meggy_${{ github.ref_name | replace:'desktop-v','' }}_x64_en-US.msi)

            **Linux:**
            - [AppImage](https://github.com/esaaraujo-lab/gdi_server/releases/download/${{ github.ref_name }}/Meggy_${{ github.ref_name | replace:'desktop-v','' }}_amd64.AppImage)
            - [.deb](https://github.com/esaaraujo-lab/gdi_server/releases/download/${{ github.ref_name }}/Meggy_${{ github.ref_name | replace:'desktop-v','' }}_amd64.deb)

            ### 📱 Outros apps Meggy
            - [Android APK](https://github.com/esaaraujo-lab/gdi_server/releases/latest) (procure pelo arquivo .apk)
            - [Roku](https://github.com/esaaraujo-lab/gdi_server/releases/latest) (procure pelo arquivo .zip)

            ### ⚠️ Windows Defender
            O Windows Defender pode sinalizar este app como suspeito (falso positivo).
            Clique em **"Mais informações"** → **"Executar mesmo assim"**.

            ### 🔧 Código fonte
            https://github.com/esaaraujo-lab/gdi_server/tree/main/meggy-desktop
          releaseDraft: false
          args: --target ${{ matrix.target }}

      # ★ v1.5.9: Sign Windows executables with self-signed cert to reduce false positives
      - name: Sign Windows executables (self-signed)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Meggy Desktop, O=esaaraujo-lab, C=BR" -KeyUsage DigitalSignature -FriendlyName "Meggy Desktop Code Signing" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(3)
          $pwd = ConvertTo-SecureString -String "meggy2024" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "meggy-code-sign.pfx" -Password $pwd
          Import-PfxCertificate -FilePath "meggy-code-sign.pfx" -Password $pwd -CertStoreLocation "Cert:\LocalMachine\Root"
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if ($signtool) {
            $files = Get-ChildItem -Path "meggy-desktop/src-tauri/target/x86_64-pc-windows-msvc/release" -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue
            foreach ($f in $files) {
              & $signtool.FullName sign /f "meggy-code-sign.pfx" /p "meggy2024" /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /v $f.FullName 2>&1
            }
          }
