name: Build Meggy Desktop (Win + Mac + Linux)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            label: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            label: macos
          - platform: ubuntu-22.04
            args: ''
            label: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python + Pillow (for icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate icons
        working-directory: meggy-desktop
        run: |
          python scripts/generate_icon.py
          npx @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Install JS dependencies
        working-directory: meggy-desktop
        run: npm install

      - name: Build Tauri app
        working-directory: meggy-desktop
        run: npx @tauri-apps/cli@2 build ${{ matrix.args }}
        env:
          # Prevent the build from failing on code signing (we don't have certs)
          APPLE_SIGNING_IDENTITY: ''
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - name: Find build artifacts
        id: find
        shell: bash
        run: |
          echo "=== Searching for artifacts ==="
          find meggy-desktop/src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) 2>/dev/null || true
          mkdir -p artifacts
          find meggy-desktop/src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meggy-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: warn

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 🐩 Meggy Desktop ${{ github.ref_name }}

            ### Downloads
            - **Windows:** `meggy_1.0.0_x64-setup.exe` (instalador NSIS)
            - **macOS:** `meggy_1.0.0_universal.dmg` (ARM + Intel)
            - **Linux:** `meggy_1.0.0_amd64.AppImage` + `.deb`

            ### Como instalar
            #### Windows
            Baixe o `.exe`, dê duplo-clique, siga o instalador.

            #### macOS
            Baixe o `.dmg`, arraste Meggy para Applications. Na 1ª abertura: botão direito → Abrir (para bypass do Gatekeeper — app não é assinado pela Apple).

            #### Linux
            Baixe o `.AppImage`, dê permissão de execução (`chmod +x meggy.AppImage`), dê duplo-clique.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
