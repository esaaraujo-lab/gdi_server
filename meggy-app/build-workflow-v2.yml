name: Build Meggy APK (Native Android)

on:
  push:
    tags: ['meggy-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK (release)
        working-directory: meggy-app
        run: gradle assembleRelease --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meggy-native-apk
          path: meggy-app/app/build/outputs/apk/release/app-release.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/meggy-v')
        uses: softprops/action-gh-release@v2
        with:
          files: meggy-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
