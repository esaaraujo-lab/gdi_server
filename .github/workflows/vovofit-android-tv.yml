name: Build Vovó Fit Android TV

on:
  push:
    tags: ['vovofit-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK (release)
        working-directory: vovofit-android-tv
        run: gradle assembleRelease --no-daemon --no-build-cache

      - name: Build APK (debug fallback)
        if: failure()
        working-directory: vovofit-android-tv
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Find APK
        run: find vovofit-android-tv -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vovofit-android-tv-apk
          path: vovofit-android-tv/app/build/outputs/apk/**/*.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/vovofit-v')
        run: |
          VERSION="${GITHUB_REF_NAME#vovofit-v}"
          APK="$(find vovofit-android-tv/app/build/outputs/apk/release -name '*.apk' -type f 2>/dev/null | sort | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find vovofit-android-tv/app/build/outputs/apk -name '*.apk' -type f | sort | head -n 1)"
          fi
          test -n "$APK" || { echo "No APK found under app/build/outputs/apk"; exit 1; }
          mv "$APK" "$(dirname "$APK")/VovoFit-${VERSION}.apk"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/vovofit-v')
        uses: softprops/action-gh-release@v2
        with:
          files: vovofit-android-tv/app/build/outputs/apk/**/VovoFit-*.apk
          generate_release_notes: true
