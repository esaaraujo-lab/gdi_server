name: Build Meggy Desktop (Win + Mac + Linux)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            label: windows
          - platform: ubuntu-22.04
            args: ''
            label: linux
          # macOS disabled until we get an Apple Developer cert for codesign.
          # To re-enable: add back the macos-latest entry with --target universal-apple-darwin.
          # - platform: macos-latest
          #   args: '--target universal-apple-darwin'
          #   label: macos

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python + Pillow (for icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate icons
        working-directory: meggy-desktop
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/generate_icon.py src-tauri/icons/icon.png
          npx @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Install JS dependencies
        working-directory: meggy-desktop
        run: npm install

      - name: Build Tauri app
        working-directory: meggy-desktop
        run: npx @tauri-apps/cli@2 build ${{ matrix.args }}
        env:
          # Disable macOS codesign — we don't have an Apple Developer cert.
          # The app will be unsigned (users need to right-click → Open on first launch).
          CODESIGN_IDENTITY: ''
          APPLE_SIGNING_IDENTITY: ''
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - name: Find build artifacts
        id: find
        shell: bash
        run: |
          echo "=== Searching for installer artifacts ==="
          mkdir -p artifacts
          # Only collect INSTALLERS (not intermediate build exes):
          # - Windows: *-setup.exe (NSIS) + *.msi
          # - macOS: *.dmg
          # - Linux: *.AppImage + *.deb
          find meggy-desktop/src-tauri/target -type f \
            \( -name "*-setup.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} artifacts/ \; 2>/dev/null || true
          echo "=== Final artifacts ==="
          ls -la artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meggy-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: warn

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Meggy Desktop ${{ github.ref_name }}

            ### Downloads
            - **Windows:** `Meggy_1.0.0_x64-setup.exe` (instalador NSIS)
            - **Linux:** `Meggy_1.0.0_amd64.AppImage` + `.deb`

            ### Como instalar
            #### Windows
            Baixe o `.exe`, dê duplo-clique, siga o instalador.

            #### Linux
            Baixe o `.AppImage`, dê permissão de execução (`chmod +x Meggy_1.0.0_amd64.AppImage`), dê duplo-clique.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
