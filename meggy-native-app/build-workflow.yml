# Meggy Native App — Build & Release workflow.
#
# Copy this file to `.github/workflows/meggy-native-app.yml` in the
# esaaraujo-lab/gdi_server repository to enable CI builds.
#
# The workflow:
#   1. Builds a signed debug-keystore release APK from meggy-native-app/
#   2. Uploads the APK as a GitHub Actions artifact (downloadable from the run page)
#   3. On tag pushes (v*), creates a GitHub Release with the APK attached.
#
# The APK is signed with the debug keystore (same approach as gdi-app v1.0.6)
# which makes it installable alongside other sideloaded apps on Android TV.

name: Build Meggy Native App

on:
  push:
    branches: [ main ]
    paths:
      - 'meggy-native-app/**'
      - '.github/workflows/meggy-native-app.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'meggy-native-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meggy-native-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('meggy-native-app/**/*.gradle*', 'meggy-native-app/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate debug.keystore (if not present)
        run: |
          # app/build.gradle references file("debug.keystore") inside the
          # :app subproject, which resolves to meggy-native-app/app/debug.keystore.
          # When no keystore.properties is present, it falls back to that path
          # with the well-known Android debug keystore password/alias.
          if [ ! -f app/debug.keystore ]; then
            echo "Generating a fresh debug.keystore for APK signing."
            keytool -genkey -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la app/debug.keystore

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Build debug APK (fallback)
        if: failure()
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          cp "$APK" meggy-release.apk
          ls -la meggy-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meggy-native-apk
          path: meggy-native-app/meggy-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: meggy-native-app/meggy-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
