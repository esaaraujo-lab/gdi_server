plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ★ v1.4.0: Carregar keystore fixa do arquivo .properties
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystoreFile))
}

android {
    namespace 'com.vovofit.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vovofit.app"
        minSdk 21
        targetSdk 34
        // ★ VOVÓ FIT v1.0.1 — Initial release (fork of BiBi Fit).
        //   4 drives: Queima Diária (12), Todo Dia (13), Clube de Casa (14), Saúde e Fitness (15).
        //   Brand: deep teal #0F3D3E + lime green #A3E635. Tag prefix vovofit-v*.
        versionCode 7
        versionName "1.0.6"
    }

    // ★ v1.4.0: Signing config com keystore FIXA (mesma em todos os builds)
    signingConfigs {
        release {
            storeFile rootProject.file('app/vovofit-release.keystore')
            storePassword 'vovofit2026'
            keyAlias 'vovofit'
            keyPassword 'vovofit2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
    // v1.0.4: cache de vídeo (VideoCache) + fonte OkHttp autenticada.
    implementation 'androidx.media3:media3-datasource:1.2.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.1'
    implementation 'androidx.media3:media3-database:1.2.1'
    // v1.0.4: leitor de MD (Markwon + tabelas + tachado) e busca no texto
    // do PDF (pdfbox-android — só para extração de texto; a renderização
    // continua no PdfRenderer nativo).
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'io.coil-kt:coil:2.5.0'
}
